<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Routes</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Get Closest Stops along Route API Test (GetGeoRoutes)</h1>
    <table id="geoRoutesTable">
        <thead>
            <tr>
                <th>Stop ID</th>
                <th>Stop Name</th>
                <th>Stop Latitude</th>
                <th>Stop Longitude</th>
                <th>Distance from Main Route (Km)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be inserted here -->
        </tbody>
    </table>

    <script>
        async function fetchGeoRoutes() {
            const params = {
                start_lon: -61.991581,
                start_lat: 45.622765,
                end_lon: -61.3696801,
                end_lat: 45.6270521
            };

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer YOUR_API_TOKEN' // Replace with your actual token if needed
            };

            try {
                const response = await axios.get('http://localhost:8000/api/v1/stn/GetGeoRoutes', { params, headers });
                const data = response.data;
                const tableBody = document.getElementById('geoRoutesTable').getElementsByTagName('tbody')[0];

                data.closest_stops.forEach(stop => {
                    const row = tableBody.insertRow();
                    row.insertCell(0).textContent = stop.stop_id;
                    row.insertCell(1).textContent = stop.stop_name;
                    row.insertCell(2).textContent = stop.stop_lat;
                    row.insertCell(3).textContent = stop.stop_lon;
                    row.insertCell(4).textContent = stop.distance_km;
                });
            } catch (error) {
                console.error('Error fetching geo routes:', error);
            }
        }

        // Call the function to fetch and display data
        fetchGeoRoutes();
    </script>
</body>
</html>
